<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract XAUUSD gold market visualization</title>
  <desc id="desc">Dark navy financial market scene with gold light, price grid, candlestick structures and an abstract gold sphere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset=".52" stop-color="#0b1d31"/><stop offset="1" stop-color="#102d45"/></linearGradient>
    <radialGradient id="glow" cx="70%" cy="44%" r="48%"><stop stop-color="#d6a63d" stop-opacity=".36"/><stop offset=".5" stop-color="#176b9b" stop-opacity=".16"/><stop offset="1" stop-color="#07111f" stop-opacity="0"/></radialGradient>
    <radialGradient id="gold" cx="32%" cy="28%" r="72%"><stop stop-color="#fff0b2"/><stop offset=".36" stop-color="#e3b64f"/><stop offset=".72" stop-color="#b87c18"/><stop offset="1" stop-color="#68410b"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1d58e" stop-opacity="0"/><stop offset=".4" stop-color="#f1d58e" stop-opacity=".7"/><stop offset="1" stop-color="#f1d58e" stop-opacity=".1"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <ellipse cx="1180" cy="410" rx="290" ry="290" fill="#d6a63d" opacity=".10" filter="url(#blur)"/>
  <g opacity=".55" stroke-linecap="round">
    <path d="M720 690 C840 600 900 625 980 525 S1120 510 1210 400 S1360 355 1510 260" fill="none" stroke="url(#line)" stroke-width="4"/>
    <path d="M720 716 C820 655 910 680 995 585 S1135 590 1210 490 S1360 455 1515 370" fill="none" stroke="#4da6d4" stroke-opacity=".28" stroke-width="2"/>
  </g>
  <g opacity=".75">
    <g transform="translate(830 330)"><line y1="-76" y2="82" stroke="#8fa6b8" stroke-width="3"/><rect x="-11" y="-20" width="22" height="58" rx="3" fill="#d6a63d"/></g>
    <g transform="translate(900 390)"><line y1="-64" y2="94" stroke="#8fa6b8" stroke-width="3"/><rect x="-11" y="-5" width="22" height="64" rx="3" fill="#2e7da7"/></g>
    <g transform="translate(970 300)"><line y1="-86" y2="70" stroke="#8fa6b8" stroke-width="3"/><rect x="-11" y="-38" width="22" height="82" rx="3" fill="#d6a63d"/></g>
    <g transform="translate(1040 350)"><line y1="-70" y2="100" stroke="#8fa6b8" stroke-width="3"/><rect x="-11" y="2" width="22" height="62" rx="3" fill="#d6a63d"/></g>
    <g transform="translate(1110 255)"><line y1="-84" y2="88" stroke="#8fa6b8" stroke-width="3"/><rect x="-11" y="-44" width="22" height="92" rx="3" fill="#d6a63d"/></g>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1220" cy="445" r="162" fill="none" stroke="#f1d58e" stroke-opacity=".22"/>
    <circle cx="1220" cy="445" r="120" fill="none" stroke="#f1d58e" stroke-opacity=".22" stroke-dasharray="8 13"/>
    <circle cx="1220" cy="445" r="88" fill="url(#gold)"/>
    <circle cx="1192" cy="416" r="26" fill="#fff" opacity=".16"/>
    <path d="M1180 445h80M1220 405v80" stroke="#65410b" stroke-opacity=".35" stroke-width="3"/>
  </g>
  <g fill="#e5edf3" opacity=".72" font-family="Arial, sans-serif">
    <text x="1320" y="222" font-size="18" letter-spacing="4">GOLD DESK</text>
    <text x="1320" y="250" font-size="42" font-weight="700" fill="#f1d58e">XAUUSD</text>
    <text x="1320" y="280" font-size="16" fill="#9eb0be">structure • timing • risk</text>
  </g>
</svg>