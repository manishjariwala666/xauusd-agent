name: WhatsApp Session Signal Fallback

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: whatsapp-session-fallback
  cancel-in-progress: false

jobs:
  deliver-session-setups:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "postgresql://fallback:unused@localhost:5432/unused"
      JWT_SECRET: "fallback-runtime-only-not-used-1234567890"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_WORKSHEET_NAME: ${{ secrets.GOOGLE_WORKSHEET_NAME }}
      GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
      GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
      GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate fallback secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_KEY GOOGLE_SHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON GREEN_API_INSTANCE_ID GREEN_API_TOKEN GREEN_API_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Deliver due Morning and Evening setups
        run: python scripts/run_whatsapp_session_fallback.py
