name: Autonomous Financial AI News Agent

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight GitHub Actions secrets
        shell: bash
        run: |
          missing=0

          check_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error title=Missing GitHub secret::$name is missing."
              echo "- $name missing" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          }

          check_secret DATABASE_URL
          check_secret SUPABASE_URL
          check_secret SUPABASE_KEY
          check_secret GOOGLE_SHEET_ID
          check_secret GOOGLE_SERVICE_ACCOUNT_JSON
          check_secret GEMINI_API_KEY
          check_secret TELEGRAM_BOT_TOKEN
          check_secret TELEGRAM_CHAT_ID

          if [ "$missing" -eq 1 ]; then
            echo "### Signal automation blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Required runtime configuration is missing. The scheduled run is failing visibly instead of reporting a false success." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate runtime configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          issues = []

          url = os.environ.get("SUPABASE_URL", "").strip()
          if not (url.startswith("https://") and url.endswith(".supabase.co")):
              issues.append(
                  "SUPABASE_URL must be the Supabase Project API URL "
                  "(https://xxxx.supabase.co), not DATABASE_URL."
              )

          jwt_secret = os.environ.get("JWT_SECRET", "")
          if len(jwt_secret) < 32:
              issues.append("JWT_SECRET must contain at least 32 characters.")

          telegram_token = "".join(
              os.environ.get("TELEGRAM_BOT_TOKEN", "").split()
          )
          if ":" not in telegram_token:
              issues.append(
                  "TELEGRAM_BOT_TOKEN must be a BotFather token and contain a colon."
              )

          if issues:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Signal automation blocked\n")
                  for issue in issues:
                      print(f"::error title=Invalid runtime configuration::{issue}")
                      summary.write(f"- {issue}\n")
              sys.exit(1)

          print("Runtime configuration format valid.")
          PY

      - name: Prepare Google service account JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "").strip()
          try:
              data = json.loads(raw)
          except Exception:
              print("::error title=Invalid GOOGLE_SERVICE_ACCOUNT_JSON::Secret is not valid JSON.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Signal automation blocked\n")
                  summary.write("GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON.\n")
              raise SystemExit(1)

          Path("service_account.json").write_text(json.dumps(data), encoding="utf-8")
          print("Google service account JSON prepared.")
          PY

      - name: Execute Autonomous Agent Core Pipeline
        shell: bash
        run: |
          python agent_main.py
          echo "Agent completed successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Execute Telegram Alert Agent
        if: always()
        shell: bash
        run: |
          echo "Telegram alert step completed safely."
