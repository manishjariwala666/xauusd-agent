name: WhatsApp production runtime smoke test

on:
  push:
    branches:
      - ops/whatsapp-test-send-2026-09-19
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
      GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
      GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify production WhatsApp runtime without sending
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import text

          required = [
              "DATABASE_URL",
              "SUPABASE_URL",
              "SUPABASE_KEY",
              "GOOGLE_SHEET_ID",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GREEN_API_INSTANCE_ID",
              "GREEN_API_TOKEN",
              "GREEN_API_CHAT_ID",
          ]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Missing runtime secrets: " + ",".join(missing))

          from core.database import session_scope
          from services.google_sheets import GoogleSheetsService
          from services.session_signal_broadcast import load_due_session_setups
          from services.whatsapp_service import WhatsAppService

          with session_scope() as session:
              site_settings = session.execute(
                  text("SELECT to_regclass('public.site_settings')")
              ).scalar_one()
          if not site_settings:
              raise SystemExit("public.site_settings is unavailable")

          sheets = GoogleSheetsService()
          values = sheets._analysis_values()
          if not values:
              raise SystemExit("Google Sheet analysis returned no rows")

          setups = load_due_session_setups(sheets)
          WhatsAppService()

          print("PRODUCTION_MAIN_RUNTIME=PASS")
          print("GOOGLE_SHEET_ROWS=" + str(len(values)))
          print("CURRENT_DUE_SESSION_SETUPS=" + str(len(setups)))
          print("WHATSAPP_PROVIDER_CONFIG=PASS")
          print("DELIVERY_LEDGER_TABLE=PASS")
          print("NO_MESSAGE_SENT=YES")
          PY
