name: Deploy VenusRealm to Google Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend.py"
      - "cloud_run_worker.py"
      - "worker.py"
      - "services/**"
      - "core/**"
      - "migrations/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy_google_cloud.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: venusrealm-google-cloud-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'venusrealm' }}
  GCP_API_SERVICE: ${{ vars.GCP_API_SERVICE || 'venusrealm-api' }}
  GCP_WORKER_JOB: ${{ vars.GCP_WORKER_JOB || 'venusrealm-worker' }}
  GCP_SCHEDULER_JOB: ${{ vars.GCP_SCHEDULER_JOB || 'venusrealm-worker-every-minute' }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Google Cloud deployment configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_RUNTIME_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Google Cloud variable::$name is not configured."
              missing=1
            fi
          done
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error title=Missing Google Cloud secret::GCP_WORKLOAD_IDENTITY_PROVIDER is not configured."
            missing=1
          fi
          if [ -z "$DEPLOYER_SERVICE_ACCOUNT" ]; then
            echo "::error title=Missing Google Cloud secret::GCP_DEPLOYER_SERVICE_ACCOUNT is not configured."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Sync existing GitHub runtime secrets into Secret Manager
        shell: bash
        env:
          SUPABASE_URL_VALUE: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_KEY }}
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_VALUE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID_VALUE: ${{ secrets.GOOGLE_SHEET_ID }}
          GREEN_API_INSTANCE_ID_VALUE: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN_VALUE: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID_VALUE: ${{ secrets.GREEN_API_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_VALUE: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_VALUE: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTER_AI_TELEGRAM_BOT_TOKEN_VALUE: ${{ secrets.MASTER_AI_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET_VALUE: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name"                 --replication-policy=automatic                 --project "$GCP_PROJECT_ID"
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name"               --data-file=-               --project "$GCP_PROJECT_ID" >/dev/null
          }

          sync_secret SUPABASE_URL "$SUPABASE_URL_VALUE"
          sync_secret SUPABASE_KEY "$SUPABASE_KEY_VALUE"
          sync_secret JWT_SECRET "$JWT_SECRET_VALUE"
          sync_secret GOOGLE_SERVICE_ACCOUNT_JSON "$GOOGLE_SERVICE_ACCOUNT_JSON_VALUE"
          sync_secret GOOGLE_SHEET_ID "$GOOGLE_SHEET_ID_VALUE"
          sync_secret GREEN_API_INSTANCE_ID "$GREEN_API_INSTANCE_ID_VALUE"
          sync_secret GREEN_API_TOKEN "$GREEN_API_TOKEN_VALUE"
          sync_secret GREEN_API_CHAT_ID "$GREEN_API_CHAT_ID_VALUE"
          sync_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN_VALUE"
          sync_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID_VALUE"
          sync_secret MASTER_AI_TELEGRAM_BOT_TOKEN "$MASTER_AI_TELEGRAM_BOT_TOKEN_VALUE"
          sync_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET_VALUE"
          sync_secret GEMINI_API_KEY "$GEMINI_API_KEY_VALUE"
          sync_secret OPENAI_API_KEY "$OPENAI_API_KEY_VALUE"

      - name: Enable required Google Cloud APIs
        run: |
          gcloud services enable             run.googleapis.com             artifactregistry.googleapis.com             cloudbuild.googleapis.com             cloudscheduler.googleapis.com             secretmanager.googleapis.com             iamcredentials.googleapis.com             --project "$GCP_PROJECT_ID"

      - name: Ensure Artifact Registry repository
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY"               --location "$GCP_REGION"               --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$GCP_ARTIFACT_REPOSITORY"               --repository-format=docker               --location="$GCP_REGION"               --description="VenusRealm production images"               --project="$GCP_PROJECT_ID"
          fi

      - name: Build and push production image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/venusrealm:$GITHUB_SHA"
          gcloud builds submit             --tag "$IMAGE"             --project "$GCP_PROJECT_ID"             .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve Secret Manager bindings
        id: runtime-secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            SUPABASE_URL
            SUPABASE_KEY
            JWT_SECRET
            GOOGLE_SERVICE_ACCOUNT_JSON
            GOOGLE_SHEET_ID
            GREEN_API_INSTANCE_ID
            GREEN_API_TOKEN
            GREEN_API_CHAT_ID
          )
          optional=(
            GOOGLE_WORKSHEET_NAME
            APP_BASE_URL
            PUBLIC_WEBSITE_URL
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            MASTER_AI_TELEGRAM_BOT_TOKEN
            TELEGRAM_ADMIN_USER_ID
            TELEGRAM_ADMIN_USER_IDS
            TELEGRAM_WEBHOOK_SECRET
            GEMINI_API_KEY
            OPENAI_API_KEY
            AI_PROVIDER
            GOLDAPI_KEY
            SMTP_HOST
            SMTP_PORT
            SMTP_USERNAME
            SMTP_PASSWORD
            EMAIL_FROM
            SMTP_USE_TLS
            USDT_WALLET_ADDRESS
            USDT_NETWORK
            SUBSCRIPTION_PRICE_USDT
            SUPPORT_EMAIL
            SUPPORT_WHATSAPP_URL
            TELEGRAM_INVITE_URL
            ADMIN_BFF_SHARED_SECRET
            WHATSAPP_ACCESS_TOKEN
            WHATSAPP_PHONE_NUMBER_ID
            WHATSAPP_BUSINESS_ACCOUNT_ID
            WHATSAPP_VERIFY_TOKEN
            META_APP_SECRET
          )

          bindings=()
          missing=0
          for name in "${required[@]}"; do
            if gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              bindings+=("$name=$name:latest")
            else
              echo "::error title=Missing Secret Manager secret::$name is required."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          for name in "${optional[@]}"; do
            if gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              bindings+=("$name=$name:latest")
            fi
          done

          joined=$(IFS=,; echo "${bindings[*]}")
          echo "bindings=$joined" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run API
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_API_SERVICE"             --image "${{ steps.image.outputs.image }}"             --region "$GCP_REGION"             --project "$GCP_PROJECT_ID"             --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT"             --platform managed             --allow-unauthenticated             --port 8080             --cpu 1             --memory 1Gi             --min-instances 0             --max-instances 4             --set-secrets "${{ steps.runtime-secrets.outputs.bindings }}"             --set-env-vars "APP_ENV=production,SKIP_STARTUP_MIGRATIONS=true"

      - name: Resolve API URL
        id: api-url
        shell: bash
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$GCP_API_SERVICE"             --region "$GCP_REGION"             --project "$GCP_PROJECT_ID"             --format='value(status.url)')
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Finalize API self URL
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$GCP_API_SERVICE"             --region "$GCP_REGION"             --project "$GCP_PROJECT_ID"             --update-env-vars "BACKEND_BASE_URL=${{ steps.api-url.outputs.url }},PUBLIC_API_URL=${{ steps.api-url.outputs.url }}"

      - name: Deploy Cloud Run worker job
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --image "${{ steps.image.outputs.image }}"
            --region "$GCP_REGION"
            --project "$GCP_PROJECT_ID"
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT"
            --command python
            --args cloud_run_worker.py
            --cpu 1
            --memory 1Gi
            --task-timeout 10m
            --max-retries 0
            --set-secrets "${{ steps.runtime-secrets.outputs.bindings }}"
            --set-env-vars "APP_ENV=production,CLOUD_RUN_WORKER_MAX_JOBS=20,BACKEND_BASE_URL=${{ steps.api-url.outputs.url }},PUBLIC_API_URL=${{ steps.api-url.outputs.url }}"
          )
          if gcloud run jobs describe "$GCP_WORKER_JOB"               --region "$GCP_REGION"               --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud run jobs update "$GCP_WORKER_JOB" "${common[@]}"
          else
            gcloud run jobs create "$GCP_WORKER_JOB" "${common[@]}"
          fi

      - name: Allow scheduler identity to execute worker job
        run: |
          gcloud run jobs add-iam-policy-binding "$GCP_WORKER_JOB"             --region "$GCP_REGION"             --project "$GCP_PROJECT_ID"             --member "serviceAccount:$GCP_RUNTIME_SERVICE_ACCOUNT"             --role "roles/run.invoker"

      - name: Configure one-minute Cloud Scheduler trigger
        shell: bash
        run: |
          set -euo pipefail
          uri="https://run.googleapis.com/v2/projects/$GCP_PROJECT_ID/locations/$GCP_REGION/jobs/$GCP_WORKER_JOB:run"
          common=(
            --location "$GCP_REGION"
            --project "$GCP_PROJECT_ID"
            --schedule "* * * * *"
            --time-zone "Asia/Kolkata"
            --uri "$uri"
            --http-method POST
            --oauth-service-account-email "$GCP_RUNTIME_SERVICE_ACCOUNT"
          )
          if gcloud scheduler jobs describe "$GCP_SCHEDULER_JOB"               --location "$GCP_REGION"               --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$GCP_SCHEDULER_JOB" "${common[@]}"
          else
            gcloud scheduler jobs create http "$GCP_SCHEDULER_JOB" "${common[@]}"
          fi

      - name: Execute worker smoke cycle
        run: |
          gcloud run jobs execute "$GCP_WORKER_JOB"             --region "$GCP_REGION"             --project "$GCP_PROJECT_ID"             --wait

      - name: Verify API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${{ steps.api-url.outputs.url }}/health"
          echo
